name: Update language percentages

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches: [main]
    paths:
      - ".github/scripts/lang-stats.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language card
        run: node .github/scripts/lang-stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Default token sees public repos only. To include private repos, create a
          # personal access token with `repo` scope, save it as the secret PROFILE_PAT,
          # then use: GH_TOKEN: ${{ secrets.PROFILE_PAT }} and set INCLUDE_PRIVATE to "true".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: "false"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/top-languages.svg
          git diff --staged --quiet || git commit -m "chore: update language percentages"
          git push
