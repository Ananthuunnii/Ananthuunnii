name: Update contribution calendar

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches: [main]
    paths:
      - ".github/scripts/contrib-calendar.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution calendar
        run: node .github/scripts/contrib-calendar.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # If this step fails with a permissions/403 error, create a personal access
          # token (classic, no scopes needed for public data), save it as the secret
          # PROFILE_PAT, and use: GH_TOKEN: ${{ secrets.PROFILE_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/contributions.svg
          git diff --staged --quiet || git commit -m "chore: update contribution calendar"
          git push
